name: Build the relay server image

# Builds src/PrankAndField.Server for linux/amd64 and linux/arm64 (Ampere VMs) and pushes it to
# ghcr.io/<owner>/prankandfield-server on every push to main or main-online that touches the server.
# Tags: the branch name (main, main-online) and the commit sha.

on:
  push:
    branches: [main, main-online]
    paths:
      - src/PrankAndField.Server/**
      - src/PrankAndField.Net/**
      - global.json
      - Directory.Build.props
      - .github/workflows/server-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/prankandfield-server" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PrankAndField.Server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.ref_name }}
            ${{ steps.name.outputs.image }}:${{ github.sha }}
